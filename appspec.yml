version: 0.0
os: linux
files:
  - source: /
    destination: /home/ubuntu/discord_bot
permissions:
  - object: /home/ubuntu/discord_bot
    owner: ubuntu
    group: ubuntu
    type:
      - directory
      - file
  - object: /home/ubuntu/discord_bot/scripts
    pattern: "*.sh"
    owner: ubuntu
    group: ubuntu
    mode: 755
    type:
      - file
hooks:
  ApplicationStart:
    - location: scripts/start-bot.sh
      timeout: 300
      runas: ubuntu
